<!DOCTYPE html>
<html>
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Mario 2</title>

<style>

body {
    margin:0;
    background:black;
    overflow:hidden;
    font-family:monospace;
}

canvas {
    display:block;
    margin:auto;
    background:#5c94fc;
    image-rendering:pixelated;
}

#menu {
    position:absolute;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background:#111;
    color:white;
    display:flex;
    justify-content:center;
    align-items:center;
    flex-direction:column;
}

h1 {
    color:red;
    font-size:45px;
}

button {
    font-size:25px;
    margin:10px;
    padding:10px 30px;
    background:#222;
    color:white;
    border:3px solid white;
}


#controls {
    display:none;
    position:fixed;
    bottom:20px;
    width:100%;
    text-align:center;
}

.control {
    width:70px;
    height:70px;
    font-size:35px;
}

</style>

</head>

<body>


<div id="menu">

<h1>MARIO 2</h1>

<button onclick="startGame()">PLAY</button>

<button onclick="settings()">SETTINGS</button>

<button onclick="howTo()">HOW TO PLAY</button>

</div>


<canvas id="game" width="800" height="450"></canvas>


<div id="controls">

<button class="control"
ontouchstart="left=true"
ontouchend="left=false">
⬅
</button>


<button class="control"
ontouchstart="jump=true"
ontouchend="jump=false">
⬆
</button>


<button class="control"
ontouchstart="right=true"
ontouchend="right=false">
➡
</button>

</div>



<script>


const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");


let playing=false;


let left=false;
let right=false;
let jump=false;


let player={

x:100,
y:300,

w:35,
h:45,

speed:5,

dy:0,

grounded:false

};


let gravity=0.7;



let platforms=[

{x:0,y:400,w:800,h:50},

{x:200,y:320,w:130,h:20},

{x:450,y:260,w:150,h:20},

{x:750,y:340,w:150,h:20},

{x:1050,y:280,w:200,h:20}

];


let cameraX=0;



function startGame(){

document.getElementById("menu").style.display="none";

playing=true;


if("ontouchstart" in window){

document.getElementById("controls").style.display="block";

}


gameLoop();

}



function settings(){

alert("Retro mode ON\nSound soon");

}



function howTo(){

alert(
"PC:\n← → ruch\nSPACE skok\n\nTelefon:\nPrzyciski na ekranie"
);

}




document.addEventListener("keydown",e=>{


if(e.key=="ArrowLeft")
left=true;


if(e.key=="ArrowRight")
right=true;


if(e.key==" " || e.key=="ArrowUp")
jump=true;


});



document.addEventListener("keyup",e=>{


if(e.key=="ArrowLeft")
left=false;


if(e.key=="ArrowRight")
right=false;


if(e.key==" " || e.key=="ArrowUp")
jump=false;


});





function update(){


if(left)
player.x-=player.speed;


if(right)
player.x+=player.speed;



if(jump && player.grounded){

player.dy=-14;

player.grounded=false;

}



player.dy+=gravity;

player.y+=player.dy;


player.grounded=false;



for(let p of platforms){


if(

player.x < p.x+p.w &&

player.x+player.w > p.x &&

player.y+player.h > p.y &&

player.y+player.h < p.y+p.h+20 &&

player.dy>=0

){

player.y=p.y-player.h;

player.dy=0;

player.grounded=true;

}


}



if(player.x>400){

cameraX=player.x-400;

}



}






function draw(){


ctx.clearRect(
0,
0,
canvas.width,
canvas.height
);



ctx.fillStyle="#5c94fc";

ctx.fillRect(
0,
0,
canvas.width,
canvas.height
);




for(let p of platforms){


ctx.fillStyle="#8B4513";


ctx.fillRect(
p.x-cameraX,
p.y,
p.w,
p.h
);



ctx.fillStyle="#00aa00";

ctx.fillRect(
p.x-cameraX,
p.y,
p.w,
5
);


}




ctx.fillStyle="red";


ctx.fillRect(

player.x-cameraX,

player.y,

player.w,

player.h

);



ctx.fillStyle="white";

ctx.font="20px monospace";

ctx.fillText(
"MARIO RETRO",
20,
30
);


}





function gameLoop(){


if(!playing)
return;


update();

draw();


requestAnimationFrame(gameLoop);


}

// ===== CZĘŚĆ 2 - ELEMENTY GRY =====


let score = 0;
let lives = 3;
let paused = false;
let win = false;


let coins = [

{x:300,y:280,taken:false},
{x:520,y:220,taken:false},
{x:800,y:300,taken:false},
{x:1100,y:240,taken:false}

];


let enemies = [

{
x:650,
y:360,
w:35,
h:35,
speed:2,
alive:true
}

];


let mushroom = {

x:950,
y:250,
taken:false

};


let finish = {

x:1300,
y:300,
w:30,
h:100

};




// dodanie rzeczy do update

let oldUpdate = update;


update=function(){


if(paused || win)
return;


oldUpdate();



// monety

for(let c of coins){

if(!c.taken &&

player.x < c.x+20 &&

player.x+player.w > c.x &&

player.y < c.y+20 &&

player.y+player.h > c.y

){

c.taken=true;

score+=10;

}

}



// przeciwnicy

for(let e of enemies){


if(!e.alive)
continue;


e.x+=e.speed;


if(e.x>900 || e.x<600){

e.speed*=-1;

}



if(

player.x < e.x+e.w &&

player.x+player.w > e.x &&

player.y < e.y+e.h &&

player.y+player.h > e.y

){


if(player.dy>0){

e.alive=false;

score+=50;

player.dy=-10;

}

else{


lives--;

player.x=100;

player.y=300;


if(lives<=0){

alert("GAME OVER\nPunkty: "+score);

location.reload();

}


}


}


}




// power-up

if(!mushroom.taken &&

player.x<mushroom.x+30 &&

player.x+player.w>mushroom.x &&

player.y<mushroom.y+30 &&

player.y+player.h>mushroom.y

){

mushroom.taken=true;

score+=100;

player.w=45;

player.h=60;

}




// meta

if(

player.x < finish.x+finish.w &&

player.x+player.w > finish.x &&

player.y < finish.y+finish.h &&

player.y+player.h > finish.y

){

win=true;

}



};





// dodanie rysowania


let oldDraw=draw;


draw=function(){


oldDraw();



// monety

for(let c of coins){


if(!c.taken){


ctx.fillStyle="yellow";


ctx.beginPath();

ctx.arc(

c.x-cameraX,

c.y,

10,

0,

Math.PI*2

);

ctx.fill();


}


}




// przeciwnicy


for(let e of enemies){


if(e.alive){


ctx.fillStyle="purple";


ctx.fillRect(

e.x-cameraX,

e.y,

e.w,

e.h

);


}


}




// grzybek


if(!mushroom.taken){


ctx.fillStyle="red";


ctx.fillRect(

mushroom.x-cameraX,

mushroom.y,

30,

30

);


}





// meta


ctx.fillStyle="white";


ctx.fillRect(

finish.x-cameraX,

finish.y,

finish.w,

finish.h

);





// informacje


ctx.fillStyle="white";

ctx.font="20px monospace";


ctx.fillText(

"COINS: "+score,

20,

60

);


ctx.fillText(

"LIVES: "+lives,

20,

85

);





if(win){


ctx.fillStyle="black";

ctx.fillRect(

150,

150,

500,

150

);



ctx.fillStyle="yellow";

ctx.font="40px monospace";


ctx.fillText(

"LEVEL COMPLETE!",

200,

240

);


}


};






// pauza ESC


document.addEventListener("keydown",e=>{


if(e.key=="Escape"){


paused=!paused;


}


});

// ===== CZĘŚĆ 2 - PEŁNA GRA =====


let coins = [
    {x:250,y:300,taken:false},
    {x:520,y:230,taken:false},
    {x:850,y:320,taken:false},
    {x:1200,y:250,taken:false}
];


let enemies = [
    {
        x:700,
        y:400,
        w:40,
        h:40,
        speed:2,
        alive:true
    },

    {
        x:1100,
        y:400,
        w:40,
        h:40,
        speed:2,
        alive:true
    }
];


let mushroom = {

    x:1000,
    y:250,
    taken:false

};


let finish = {

    x:1500,
    y:350,
    w:30,
    h:100

};


let score=0;
let lives=3;
let big=false;
let gameOver=false;
let win=false;




// dodajemy do update

let oldUpdate=update;


update=function(){


if(gameOver || win)
return;


oldUpdate();



// MONETY

for(let c of coins){


if(!c.taken &&

player.x < c.x+20 &&

player.x+player.width > c.x &&

player.y < c.y+20 &&

player.y+player.height > c.y

){


c.taken=true;

score+=10;


}


}




// WROGOWIE


for(let e of enemies){


if(!e.alive)
continue;



e.x+=e.speed;



if(e.x>1200 || e.x<600){

e.speed*=-1;

}




if(collision(player,e)){



if(player.vy>0){


e.alive=false;

player.vy=-10;

score+=50;


}

else{


lives--;


player.x=100;

player.y=300;



if(lives<=0){

gameOver=true;

}


}


}


}






// GRZYBEK


if(!mushroom.taken &&

collision(player,{
x:mushroom.x,
y:mushroom.y,
w:30,
h:30,
width:30,
height:30
})

){


mushroom.taken=true;

big=true;

player.width=50;

player.height=65;

score+=100;


}







// META


if(collision(player,{

x:finish.x,
y:finish.y,
w:finish.w,
h:finish.h,
width:finish.w,
height:finish.h

})){


win=true;


}



};








// dodajemy do draw


let oldDraw=draw;


draw=function(){


oldDraw();




// MONETY


for(let c of coins){


if(!c.taken){


ctx.fillStyle="yellow";


ctx.beginPath();


ctx.arc(

c.x-camera.x,

c.y,

12,

0,

Math.PI*2

);


ctx.fill();


}


}







// WROGOWIE


for(let e of enemies){


if(e.alive){


ctx.fillStyle="purple";


ctx.fillRect(

e.x-camera.x,

e.y,

e.w,

e.h

);


}


}







// GRZYBEK


if(!mushroom.taken){


ctx.fillStyle="red";


ctx.fillRect(

mushroom.x-camera.x,

mushroom.y,

30,

30

);


}







// META


ctx.fillStyle="white";


ctx.fillRect(

finish.x-camera.x,

finish.y,

finish.w,

finish.h

);








// HUD


ctx.fillStyle="white";

ctx.font="22px monospace";


ctx.fillText(

"COINS: "+score,

20,

60

);


ctx.fillText(

"LIVES: "+lives,

20,

90

);








// KONIEC


if(gameOver){


ctx.fillStyle="black";


ctx.fillRect(
200,
150,
500,
150
);



ctx.fillStyle="red";

ctx.font="45px monospace";


ctx.fillText(

"GAME OVER",

300,

240

);


}






if(win){


ctx.fillStyle="black";


ctx.fillRect(
150,
150,
600,
150
);



ctx.fillStyle="yellow";


ctx.font="40px monospace";


ctx.fillText(

"LEVEL COMPLETE!",

220,

240

);


}



};






</script>

</body>
</html>
