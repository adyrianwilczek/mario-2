<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Mario Retro</title>

<style>
body {
    margin:0;
    background:#000;
    overflow:hidden;
    font-family:monospace;
}

canvas {
    display:block;
    margin:auto;
    background:#5c94fc;
    image-rendering:pixelated;
}

#menu {
    position:fixed;
    inset:0;
    background:#111;
    color:white;
    display:flex;
    justify-content:center;
    align-items:center;
    flex-direction:column;
}

h1 {
    color:red;
    font-size:50px;
    text-shadow:4px 4px #700;
}

button {
    font-family:monospace;
    font-size:25px;
    padding:10px 30px;
    margin:8px;
    background:#222;
    color:white;
    border:3px solid white;
}

#mobile {
    display:none;
    position:fixed;
    bottom:20px;
    width:100%;
    text-align:center;
}

.mobileBtn {
    width:80px;
    height:80px;
    font-size:35px;
}
</style>

</head>

<body>


<div id="menu">

<h1>MARIO RETRO</h1>

<button onclick="startGame()">PLAY</button>
<button onclick="alert('Retro mode ON')">SETTINGS</button>

</div>



<canvas id="game" width="900" height="500"></canvas>



<div id="mobile">

<button class="mobileBtn"
ontouchstart="keys.left=true"
ontouchend="keys.left=false">
⬅
</button>

<button class="mobileBtn"
ontouchstart="keys.jump=true"
ontouchend="keys.jump=false">
⬆
</button>

<button class="mobileBtn"
ontouchstart="keys.right=true"
ontouchend="keys.right=false">
➡
</button>

</div>



<script>

const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");


let playing=false;


let keys={
left:false,
right:false,
jump:false
};


let player={
x:100,
y:300,
w:40,
h:50,
vx:0,
vy:0,
speed:5,
jumpPower:-15,
ground:false,
big:false
};


let gravity=0.7;


let camera={
x:0
};



let blocks=[

{x:0,y:450,w:3000,h:50},

{x:250,y:350,w:120,h:25},

{x:550,y:280,w:150,h:25},

{x:850,y:370,w:150,h:25},

{x:1200,y:300,w:180,h:25}

];



function startGame(){

document.getElementById("menu").style.display="none";

if("ontouchstart" in window)
document.getElementById("mobile").style.display="block";

playing=true;

loop();

}



document.addEventListener("keydown",e=>{

if(e.key==="ArrowLeft")
keys.left=true;

if(e.key==="ArrowRight")
keys.right=true;

if(e.key===" " || e.key==="ArrowUp")
keys.jump=true;

});



document.addEventListener("keyup",e=>{

if(e.key==="ArrowLeft")
keys.left=false;

if(e.key==="ArrowRight")
keys.right=false;

if(e.key===" " || e.key==="ArrowUp")
keys.jump=false;

});




function hit(a,b){

return (

a.x < b.x+b.w &&
a.x+a.w > b.x &&
a.y < b.y+b.h &&
a.y+a.h > b.y

);

}




function update(){


player.vx=0;


if(keys.left)
player.vx=-player.speed;


if(keys.right)
player.vx=player.speed;


player.x+=player.vx;



if(keys.jump && player.ground){

player.vy=player.jumpPower;
player.ground=false;

}



player.vy+=gravity;
player.y+=player.vy;


player.ground=false;



for(let b of blocks){

if(hit(player,b)){


if(player.vy>0){

player.y=b.y-player.h;
player.vy=0;
player.ground=true;

}


}

}



camera.x=player.x-300;

if(camera.x<0)
camera.x=0;



}




function draw(){


ctx.clearRect(
0,
0,
canvas.width,
canvas.height
);



ctx.fillStyle="#5c94fc";

ctx.fillRect(
0,
0,
canvas.width,
canvas.height
);



// chmury

ctx.fillStyle="white";

ctx.fillRect(
150-camera.x,
80,
100,
30
);

ctx.fillRect(
180-camera.x,
60,
60,
30
);



// mapa

for(let b of blocks){

ctx.fillStyle="#8b4513";

ctx.fillRect(
b.x-camera.x,
b.y,
b.w,
b.h
);

}



// gracz

ctx.fillStyle=player.big?"orange":"red";

ctx.fillRect(
player.x-camera.x,
player.y,
player.w,
player.h
);



ctx.fillStyle="white";

ctx.font="20px monospace";

ctx.fillText(
"MARIO RETRO",
20,
30
);


}



function loop(){

if(!playing)
return;


update();

draw();


requestAnimationFrame(loop);

}


let score=0;
let lives=3;
let worldNumber=1;
let finished=false;



let coins=[

{x:500,y:300,taken:false},
{x:900,y:220,taken:false},
{x:1400,y:260,taken:false},
{x:2200,y:300,taken:false}

];



let enemies=[

{
x:700,
y:410,
w:40,
h:40,
speed:2,
alive:true
},

{
x:1700,
y:410,
w:40,
h:40,
speed:3,
alive:true
}

];



let castle={

x:5600,
y:250,
w:150,
h:200

};




// drugi świat

let lavaCastle={

x:6000,
y:0,
active:false

};






let oldUpdate=update;



update=function(){


if(finished)
return;


oldUpdate();



// monety

for(let c of coins){


if(!c.taken &&

player.x<c.x+20 &&

player.x+player.w>c.x &&

player.y<c.y+20 &&

player.y+player.h>c.y

){


c.taken=true;

score+=10;


}

}





// przeciwnicy


for(let e of enemies){


if(!e.alive)
continue;


e.x+=e.speed;


if(e.x>e.x+200 || e.x<500)
e.speed*=-1;



if(collision(player,e)){



if(player.vy>0){


e.alive=false;

player.vy=-10;

score+=50;


}

else{


lives--;

player.x=100;
player.y=300;


if(lives<=0){

alert("GAME OVER");

location.reload();

}


}


}



}







// zamek


if(collision(player,{

x:castle.x,
y:castle.y,
w:castle.w,
h:castle.h

})){


worldNumber=2;

lavaCastle.active=true;


player.x=100;


alert("WORLD 2 - LAVA CASTLE");


}






};









let oldDraw=draw;


draw=function(){


oldDraw();



// monety


for(let c of coins){


if(!c.taken){


ctx.fillStyle="yellow";


ctx.beginPath();


ctx.arc(

c.x-camera,

c.y,

10,

0,

Math.PI*2

);


ctx.fill();


}

}




// przeciwnicy


for(let e of enemies){


if(e.alive){


ctx.fillStyle="purple";


ctx.fillRect(

e.x-camera,

e.y,

e.w,

e.h

);


}


}






// zamek


ctx.fillStyle="#555";


ctx.fillRect(

castle.x-camera,

castle.y,

castle.w,

castle.h

);



ctx.fillStyle="#222";


ctx.fillRect(

castle.x+55-camera,

castle.y+120,

40,

80

);







// HUD


ctx.fillStyle="white";

ctx.font="22px monospace";


ctx.fillText(

"COINS: "+score,

20,

60

);


ctx.fillText(

"LIVES: "+lives,

20,

90

);



ctx.fillText(

"WORLD: "+worldNumber,

20,

120

);







if(lavaCastle.active){


ctx.fillStyle="#ff5500";


ctx.fillRect(

camera,

0,

900,

500

);



ctx.fillStyle="#333";


ctx.font="40px monospace";


ctx.fillText(

"LAVA CASTLE",

250,

100

);


}




};




// koniec pliku

</script>

</body>
</html>
